
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Blood Bank Management</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="login-container">
    <div class="login-box">
        <h1>🩸 Smart Blood Bank</h1>
        <p>Management & Intelligent Donor Matching System</p>

        <h2>Admin Login</h2>
        <p>Demo login: <strong>admin</strong> / <strong>admin123</strong></p>
        {% for message in get_flashed_messages() %}
        <p class="message">{{ message }}</p>
        {% endfor %}
        <form action="{{ url_for('login') }}" method="POST">
            <input type="text" name="username" placeholder="Enter Username"
            autocomplete="username" required>
            <input type="password" name="password" placeholder="Enter Password"
            autocomplete="current-password" required>
            <button type="submit">Login</button>
        </form>
        <a href="/register">Register as a Blood Donor</a>
    </div>
</div>

</body>
</html>
